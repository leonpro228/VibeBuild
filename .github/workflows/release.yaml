name: Release CI

on:
  push:
    tags:
      - 'v*' # Запуск при создании тега, например v1.0.0

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # matrix запускает сборку параллельно на Windows и Linux
        include:
          - platform: 'ubuntu-22.04' # Соберет .deb и .AppImage
          - platform: 'windows-latest' # Соберет .exe и .msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Установка Node.js
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-node-version: lts/*

      # Установка Rust
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Специфичные зависимости для Linux
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Установка зависимостей вашего фронтенда
      - name: install frontend dependencies
        run: yarn install

      # Сборка приложения с помощью официального Tauri Action
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: 'Автоматический релиз для версии ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
